name: Update Toffee Cookie
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Get Cookie
        run: |
          COOKIE=$(curl -sI https://toffeelive.com | grep -i "set-cookie" | awk '{print $2}' | tr -d '\r' | tr '\n' ' ')
          echo "{\"cookie\": \"$COOKIE\", \"updated\": \"$(date)\"}" > token.json
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add token.json
          git commit -m "Update Toffee Cookie" || exit 0
          git push
